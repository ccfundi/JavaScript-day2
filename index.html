<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Day2: Interactive counter</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #count-display{
            font-size: 4rem;
            margin: 20px 0;
            color: #333;
        }

        button{
            font-size: 1.2rem;
            padding: 10px, 20px;
            margin: 0, 10px;
            cursor: pointer;
        }

        #reset-btn{
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .warning {
            color: orange;
            font-weight: bold;
            height: 20px;
        }
    </style>
</head>
<body>
    <h1>Interactive Counter App</h1>

    <div id="count-display">0</div>
    <p id="message" class="warning"></p>

    <div class="controls">
    <button id="decrement-btn">- Decrement</button>
    <button id="reset-btn">Reset</button>
    <button id="increment-btn">+ Increment</button>
    </div>


    <div>
        <label for="step-input">Step Size:</label>
        <input type="number" id="step-input" value="1" min="1" max="10" style="width: 50px; padding: 5px; text-align: center;">
    </div>

    <script src="script.js"></script>
</body>
</html>
